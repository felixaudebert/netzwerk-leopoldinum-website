# Netzwerk Leopoldinum – Supabase wach halten
# Kostenlose Supabase-Projekte pausieren nach rund einer Woche ohne Nutzung.
# Dieser Ablauf fragt deshalb einmal pro Woche eine öffentliche Tabelle ab (nur Lesen, nur der
# öffentliche Schlüssel aus js/config.js). Schlägt die Abfrage fehl, schickt GitHub eine Fehler-Mail.
#
# Von Hand starten: GitHub → Actions → "Supabase wach halten" → "Run workflow".

name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 * * 1"   # jeden Montag 06:17 UTC (07:17 / 08:17 Uhr deutscher Zeit)
  workflow_dispatch:

permissions:
  actions: write   # nur für den Schritt "Zeitplan aktiv halten"
  contents: read

jobs:
  anpingen:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        env:
          URL: https://tjvjufyftfracjftfkdv.supabase.co
          KEY: sb_publishable_cQwTs1a96nFUhu_WJfE-6Q_up8TX0LA
        run: |
          for versuch in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/veranstaltungen?select=id&limit=1" -H "apikey: $KEY")
            echo "Versuch $versuch: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Supabase antwortet nicht (HTTP $code). Ist das Projekt pausiert? Im Supabase-Dashboard prüfen."
          exit 1

      # GitHub schaltet Zeitpläne in Repositories ab, in denen 60 Tage lang nichts passiert.
      # Das erneute Aktivieren über die API setzt diese Frist zurück – ohne Commit.
      - name: Zeitplan aktiv halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-wachhalten.yaml/enable"
